# Personal Finance Agent — LLM task → model routing
#
# Background:
# - Per Task 0 preconditions check (2026-04-21) and live smoke (2026-04-25):
#   * gemini/gemini-2.5-flash + groq/llama-3.3-70b-versatile work on free tier
#   * gemini/gemini-2.5-pro free-tier quota = 0 (FAILED smoke)
#   * anthropic/claude-sonnet-4-6 needs paid credit (FAILED smoke until top-up)
# - Stakes:high tasks (PDF extraction, sql_agent, affordability_reasoning) keep
#   Claude as primary because PRD §6.4 explicitly chose them on reasoning quality.
#   While Anthropic is unfunded, those calls will fail over to a documented-
#   degraded zero-cost model. Surface the degradation honestly rather than
#   silently swap weaker primaries.
# - Gemini 2.5 Pro removed as fallback everywhere — its free-tier quota is 0,
#   so it was a dead option. Replaced with groq/llama-3.3-70b-versatile where
#   the task is text-only (sql_agent, affordability_reasoning).
# - pdf_extraction's fallback STAYS on Claude Sonnet because it's the only
#   vision-capable option in this stack besides Gemini. Substituting Groq Llama
#   would be silently wrong — Llama 3.3 70B is text-only.
#
# ───────────────────────────────────────────────────────────────────────────
# 2026-05-19 — Routing flip LANDED with W4.1 (see git log for plan + commits).
# Per docs/superpowers/specs/2026-04-30-llm-routing-anthropic-zero-spend.md.
# Anthropic remains in fallback / escalation slot only.
# ───────────────────────────────────────────────────────────────────────────

pdf_extraction:
  model: gemini/gemini-2.5-flash
  fallbacks: [anthropic/claude-sonnet-4-6]   # vision-capable; needs paid Anthropic to fire
  stakes: high

merchant_categorization:
  model: groq/llama-3.3-70b-versatile
  fallbacks: [gemini/gemini-2.5-flash]
  stakes: low

income_classification:
  model: gemini/gemini-2.5-flash
  fallbacks: []
  stakes: medium

sql_agent:
  model: groq/llama-3.3-70b-versatile           # was: anthropic/claude-sonnet-4-6 — flipped 2026-05-19 under zero-spend constraint
  fallbacks: [anthropic/claude-sonnet-4-6]      # was: [groq/...]
  stakes: high
  # Reviewer layer (sql_agent_judge + sql_agent_judge_strict + sql_agent_strict)
  # catches the quality cases where Llama's degraded multi-CTE handling matters.
  # Sonnet fallback fires only on Groq unavailability — the reviewer-layer
  # judge escalation is the cost-observable spend path, separate from this.

affordability_reasoning:
  model: groq/llama-3.3-70b-versatile           # was: anthropic/claude-sonnet-4-6 — same 2026-05-19 flip
  fallbacks: [anthropic/claude-sonnet-4-6]
  stakes: high
  # NO reviewer layer in V1 — gated by PRD §6.5 data-quality guard until ≥60d
  # of clean ingested history (~late June 2026). Revisit reviewer design when
  # sql_agent operational data exists. See spec §8.

morning_brief:
  model: gemini/gemini-2.5-flash
  fallbacks: [groq/llama-3.3-70b-versatile]
  stakes: low

weekly_review:
  model: gemini/gemini-2.5-flash
  fallbacks: [groq/llama-3.3-70b-versatile]
  stakes: low

embeddings:
  model: gemini/text-embedding-004
  fallbacks: []
  stakes: low

# W4.1 reviewer-layer entries (added 2026-05-19):

sql_agent_judge:
  model: gemini/gemini-2.5-flash
  fallbacks: [anthropic/claude-sonnet-4-6]
  stakes: medium
  # Primary judge in the reviewer layer. Returns JSON {verdict, confidence, reason}.

sql_agent_judge_strict:
  model: anthropic/claude-sonnet-4-6
  fallbacks: []                                 # if Sonnet fails here, reviewer surfaces "uncertain" to user (no silent degrade to the model we escalated away from)
  stakes: high
  # Escalation judge — called explicitly when Gemini returns uncertain / low-confidence.

sql_agent_strict:
  model: anthropic/claude-sonnet-4-6
  fallbacks: []                                 # last resort — surfaces "rephrase?" to user on failure (fail loud, don't silently degrade)
  stakes: high
  # Last-resort SQL generation, called only after Groq retry-with-critique fails the judge.
  # Distinct from sql_agent.fallbacks so cost is observable + intentional, not implicit.

sql_agent_narrator:
  model: gemini/gemini-2.5-flash
  fallbacks: [groq/llama-3.3-70b-versatile]
  stakes: low
  # Converts raw SQL result rows into a concise, conversational Telegram reply.
  # Called after a successful render — never sees raw PII beyond what the user asked.
