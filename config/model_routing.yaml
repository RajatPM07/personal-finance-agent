# Personal Finance Agent — LLM task → model routing
#
# Background:
# - Per Task 0 preconditions check (2026-04-21) and live smoke (2026-04-25):
#   * gemini/gemini-2.5-flash + groq/llama-3.3-70b-versatile work on free tier
#   * gemini/gemini-2.5-pro free-tier quota = 0 (FAILED smoke)
#   * anthropic/claude-sonnet-4-6 needs paid credit (FAILED smoke until top-up)
# - Stakes:high tasks (PDF extraction, sql_agent, affordability_reasoning) keep
#   Claude as primary because PRD §6.4 explicitly chose them on reasoning quality.
#   While Anthropic is unfunded, those calls will fail over to a documented-
#   degraded zero-cost model. Surface the degradation honestly rather than
#   silently swap weaker primaries.
# - Gemini 2.5 Pro removed as fallback everywhere — its free-tier quota is 0,
#   so it was a dead option. Replaced with groq/llama-3.3-70b-versatile where
#   the task is text-only (sql_agent, affordability_reasoning).
# - pdf_extraction's fallback STAYS on Claude Sonnet because it's the only
#   vision-capable option in this stack besides Gemini. Substituting Groq Llama
#   would be silently wrong — Llama 3.3 70B is text-only.
#
# ───────────────────────────────────────────────────────────────────────────
# 2026-04-30 SCHEDULED CHANGE — to land with W4.1 (SQL agent) implementation:
# ───────────────────────────────────────────────────────────────────────────
# Per docs/superpowers/specs/2026-04-30-llm-routing-anthropic-zero-spend.md
# (locked v2), under a hard zero-Anthropic-spend constraint, the following
# routing changes will land when the W4.1 SQL agent ships:
#
#   sql_agent:
#     primary: anthropic/claude-sonnet-4-6  →  groq/llama-3.3-70b-versatile
#     fallbacks: [groq/...]                 →  [anthropic/claude-sonnet-4-6]
#
#   affordability_reasoning:
#     same flip as sql_agent.
#
# Plus three new task entries (also added with W4.1):
#   - sql_agent_judge          (Gemini Flash, primary judge in reviewer layer)
#   - sql_agent_judge_strict   (Anthropic Sonnet, escalation judge)
#   - sql_agent_strict         (Anthropic Sonnet, last-resort SQL gen)
#
# And one new task entry that lands with W3.4 (Payslip parser):
#   - payslip_extraction       (Gemini Flash, vision + structured output)
#
# Rationale for keeping the current entries unchanged until W4.1:
#   1. sql_agent + affordability_reasoning are not invoked anywhere in the
#      shipped code today (no caller exists pre-W4.1), so flipping the yaml
#      now would be a no-op until W4.1 wires it up.
#   2. The reviewer layer (§4 of the linked spec) is what makes the flip
#      defensible — flipping the yaml without the reviewer would silently
#      degrade quality. Land them together.
#   3. W3.4 (Payslip) ships before W4.1 and adds payslip_extraction at that
#      point — also defers the rest of the flip to W4.1 by design.
#
# Treat this comment block as the authoritative scheduled-change record
# until W4.1 commits the actual yaml diff.
# ───────────────────────────────────────────────────────────────────────────

pdf_extraction:
  model: gemini/gemini-2.5-flash
  fallbacks: [anthropic/claude-sonnet-4-6]   # vision-capable; needs paid Anthropic to fire
  stakes: high

merchant_categorization:
  model: groq/llama-3.3-70b-versatile
  fallbacks: [gemini/gemini-2.5-flash]
  stakes: low

income_classification:
  model: gemini/gemini-2.5-flash
  fallbacks: []
  stakes: medium

sql_agent:
  model: anthropic/claude-sonnet-4-6
  fallbacks: [groq/llama-3.3-70b-versatile]   # zero-cost degraded fallback. Was gemini-2.5-pro (free-tier=0).
  stakes: high                                # When fallback fires, user sees materially-worse SQL on complex multi-table queries — verify outputs.

affordability_reasoning:
  model: anthropic/claude-sonnet-4-6
  fallbacks: [groq/llama-3.3-70b-versatile]   # zero-cost degraded fallback. Same rationale as sql_agent.
  stakes: high                                # PRD §6.5 data-quality guard provides defence-in-depth for this task.

morning_brief:
  model: gemini/gemini-2.5-flash
  fallbacks: [groq/llama-3.3-70b-versatile]
  stakes: low

weekly_review:
  model: gemini/gemini-2.5-flash
  fallbacks: [groq/llama-3.3-70b-versatile]
  stakes: low

embeddings:
  model: gemini/text-embedding-004
  fallbacks: []
  stakes: low
